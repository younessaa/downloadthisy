<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DownloadThisYouTube – Free YouTube and Instagram Reels Downloader{% endblock %}</title>
  <meta name="description" content="Download YouTube videos, Instagram Reels and audio in MP4, MP3 and M4A. Just add 'downloadthis' before youtube.com in any link.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg bg-body border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('index') }}">
        <span class="brand-logo"><i class="bi bi-download"></i></span>
        DownloadThis<span class="text-danger">YouTube</span>
      </a>
      <button class="btn btn-outline-secondary btn-sm" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>
  </nav>

  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-4 mt-5">
    <div class="container small text-body-secondary text-center">
      <p class="mb-1">&copy; DownloadThisYouTube. Not affiliated with YouTube, Google, Instagram or Meta.</p>
      <p class="mb-0">Only download videos you own or have permission to download. Respect copyright and each platform's Terms of Service.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
